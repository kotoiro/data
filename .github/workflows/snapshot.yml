name: Snapshot

# Fetches the upstream data Kotoiro's built-in dictionaries and word data are built from, and
# publishes it unchanged, or derived where it can't be kept as it is, as a release named after the
# day's JMdict: upstream-YYYY.MM.DD. JMdict's licence asks apps that carry it to update it
# regularly, so this runs every month, and by hand.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write

# Every file but JMdict's, Jiten's and CC-CEDICT's is pinned by its SHA-256 in pinned.sha256, under
# the name it is released as. A new version gets a new pin.
env:
  # JMdict, English only. The EDRDG publishes a new file at this one URL every day and keeps no
  # older ones, so it can't be pinned: each release is the record of one day's file.
  JMDICT_URL: https://www.edrdg.org/pub/Nihongo/JMdict_e.gz
  # Open English WordNet, pinned by edition.
  WORDNET_URL: https://github.com/globalwordnet/english-wordnet/releases/download/2025-edition/english-wordnet-2025.xml.gz
  # Princeton WordNet 3.1, its last release. Kotoiro reads only its sense frequencies
  # (dict/cntlist.rev), which Open English WordNet doesn't have.
  PRINCETON_URL: https://wordnetcode.princeton.edu/wn3.1.dict.tar.gz
  # Jiten's global frequency list, for how common each word is, which JMdict tags only coarsely.
  # Jiten serves its current list at this one URL and keeps no older ones, so like JMdict it can't
  # be pinned.
  JITEN_URL: https://api.jiten.moe/api/frequency-list/download?downloadType=csv
  # wordfreq 3.2, its last release: how common each English and Chinese spelling is, and the
  # table it maps traditional Chinese to simplified with, since it counts only simplified.
  WORDFREQ_URL: https://raw.githubusercontent.com/rspeer/wordfreq/v3.2/wordfreq/data
  # Lancaster's BNC lemma list: English counted by Headword and part of speech, which shares out
  # wordfreq's count of a spelling among the words it can be.
  BNC_URL: https://ucrel.lancs.ac.uk/bncfreq/lists/1_1_all_fullalpha.zip
  # The CEFR-J Wordlist 1.6. Its terms allow making another word list from it but don't mention
  # redistribution, so a release holds only the list scripts/cefrj.py derives from it.
  CEFRJ_URL: https://www.cefr-j.org/data/CEFRJ_wordlist_ver1.6.zip
  # Octanove's C1 and C2 words, which carry on where CEFR-J stops, pinned by commit.
  OCTANOVE_URL: https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/d4e45b75b38f27b30dfc5c44d8c571aec7e7092f/octanove-vocabulary-profile-c1c2-1.0.csv
  # Jonathan Waller's JLPT lists, with the JMdict entry number of each word, pinned by commit.
  # Released as jlpt-n5.csv to jlpt-n1.csv.
  JLPT_URL: https://raw.githubusercontent.com/stephenmk/yomitan-jlpt-vocab/b062d4e38c4bdd0950ae1d4ec55f04b176182e03/original_data
  # The NGSL family's word lists, NGSL 1.2, NAWL 1.2, TSL 1.2 and BSL 1.20.
  NGSL_URL: https://www.newgeneralservicelist.com/s
  # CC-CEDICT, Chinese to English. MDBG publishes a new file at this one URL every day and keeps no
  # older ones, so like JMdict it can't be pinned: its header says which day's it is.
  CEDICT_URL: https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz
  # Unicode's Unihan database, pinned by version: how often each reading of a Chinese character
  # is used, and its usual reading, for choosing which of CC-CEDICT's entries comes first.
  UNIHAN_URL: https://www.unicode.org/Public/18.0.0/ucd/Unihan.zip
  # EJDict, English to Japanese, pinned by release.
  EJDICT_URL: https://github.com/kujirahand/EJDict/releases/download/v2.0.1/ejdic-hand-txt.zip

jobs:
  snapshot:
    name: Fetch and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch
        run: |
          mkdir out
          cd out
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          fetch() { curl -fsSL --retry 3 -A "$ua" -o "$1" "$2"; }
          wordnet=${WORDNET_URL##*/}
          princeton=${PRINCETON_URL##*/}
          cefrj=${CEFRJ_URL##*/}
          fetch JMdict_e.gz "$JMDICT_URL"
          fetch "$wordnet" "$WORDNET_URL"
          fetch "$princeton" "$PRINCETON_URL"
          fetch jiten_freq_global.csv "$JITEN_URL"
          for list in large_en large_zh _chinese_mapping; do
            fetch "$list.msgpack.gz" "$WORDFREQ_URL/$list.msgpack.gz"
          done
          fetch "${BNC_URL##*/}" "$BNC_URL"
          fetch "$cefrj" "$CEFRJ_URL"
          fetch "${OCTANOVE_URL##*/}" "$OCTANOVE_URL"
          for level in 5 4 3 2 1; do
            fetch "jlpt-n$level.csv" "$JLPT_URL/n$level.csv"
          done
          for list in NGSL_12_stats NAWL_12_lemmatized_for_teaching TSL_12_stats BSL_120_stats; do
            fetch "$list.csv" "$NGSL_URL/$list.csv"
          done
          cedict=${CEDICT_URL##*/}
          fetch "$cedict" "$CEDICT_URL"
          fetch "${UNIHAN_URL##*/}" "$UNIHAN_URL"
          fetch "${EJDICT_URL##*/}" "$EJDICT_URL"
          sha256sum -c --quiet ../pinned.sha256
          gzip -t JMdict_e.gz
          # Jiten's list has no SHA-256 to check, but its header shows it is the list.
          if [ "$(head -n1 jiten_freq_global.csv | tr -d '\r')" != 'Word,Form,Rank' ]; then
            echo "jiten_freq_global.csv doesn't start with Jiten's header" >&2
            exit 1
          fi
          # Nor has CC-CEDICT, but its header shows it is still in the format Kotoiro reads, under
          # the same licence.
          gzip -t "$cedict"
          header=$(gzip -dc "$cedict" | grep '^#! ' | tr -d '\r')
          for line in '#! version=1' '#! format=ts' '#! charset=UTF-8' \
            '#! license=https://creativecommons.org/licenses/by-sa/4.0/'; do
            if ! grep -qxF -- "$line" <<< "$header"; then
              echo "$cedict's header lacks '$line'" >&2
              exit 1
            fi
          done
          python3 -I ../scripts/cefrj.py "$cefrj" > cefrj-1.6.tsv
          mv "$cefrj" ..
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gzip -dc out/JMdict_e.gz | grep -m1 -o 'JMdict created: [0-9-]*' | cut -d' ' -f3)
          if [ -z "$created" ]; then
            echo "JMdict_e.gz says nothing of when it was created" >&2
            exit 1
          fi
          tag=upstream-$(echo "$created" | tr - .)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is published already: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cefrj=${CEFRJ_URL##*/}
          cedict=${CEDICT_URL##*/}
          cedict_date=$(gzip -dc "out/$cedict" | grep '^#! date=' | tr -d '\r' | cut -d= -f2 | cut -dT -f1)
          cat > notes.md <<EOF
          Each upstream file, unchanged but for one derived list:

          - \`JMdict_e.gz\`: JMdict of $created, English only, the property of the [Electronic Dictionary Research and Development Group](https://www.edrdg.org/), [CC BY-SA 4.0](https://www.edrdg.org/edrdg/licence.html)
          - \`${WORDNET_URL##*/}\`: [Open English WordNet](https://github.com/globalwordnet/english-wordnet), [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
          - \`${PRINCETON_URL##*/}\`: [Princeton WordNet](https://wordnet.princeton.edu/) 3.1, © 2011 Princeton University, under the [WordNet licence](https://wordnet.princeton.edu/license-and-commercial-use), which heads each of its files
          - \`jiten_freq_global.csv\`: [Jiten](https://jiten.moe/frequency-dictionaries)'s global frequency list of $(date -u +%F), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`large_en.msgpack.gz\`, \`large_zh.msgpack.gz\`, \`_chinese_mapping.msgpack.gz\`: [wordfreq](https://github.com/rspeer/wordfreq) 3.2's data by Robyn Speer, [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`${BNC_URL##*/}\`: the BNC lemma list of Leech, Rayson and Wilson, *Word Frequencies in Written and Spoken English* (2001), from [Lancaster](https://ucrel.lancs.ac.uk/bncfreq/flists.html), [CC BY-SA 2.0 UK](https://creativecommons.org/licenses/by-sa/2.0/uk/)
          - \`cefrj-1.6.tsv\`: derived from the CEFR-J Wordlist Version 1.6, compiled by Yukio Tono, Tokyo University of Foreign Studies: each word's Headword, part of speech and CEFR level, under [its terms](https://www.cefr-j.org/download.html). From \`$cefrj\`, $CEFRJ_URL, SHA-256 $(grep " $cefrj\$" pinned.sha256 | cut -d' ' -f1)
          - \`${OCTANOVE_URL##*/}\`: the [Octanove Vocabulary Profile C1/C2](https://github.com/openlanguageprofiles/olp-en-cefrj) 1.0 by Octanove Labs, [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`jlpt-n5.csv\` to \`jlpt-n1.csv\`: [Jonathan Waller](http://www.tanos.co.uk/jlpt/)'s JLPT lists, under Creative Commons BY, with JMdict entry numbers by [stephenmk/yomitan-jlpt-vocab](https://github.com/stephenmk/yomitan-jlpt-vocab), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`NGSL_12_stats.csv\`, \`NAWL_12_lemmatized_for_teaching.csv\`: the [New General Service List](https://www.newgeneralservicelist.com/new-general-service-list) and the [New Academic Word List](https://www.newgeneralservicelist.com/new-academic-word-list) 1.2 by Browne, C., Culligan, B., and Phillips, J., [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`TSL_12_stats.csv\`, \`BSL_120_stats.csv\`: the [TOEIC Service List](https://www.newgeneralservicelist.com/toeic-service-list) 1.2 and the [Business Service List](https://www.newgeneralservicelist.com/business-service-list) 1.20 by Browne, C. and Culligan, B., [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`$cedict\`: [CC-CEDICT](https://cc-cedict.org/wiki/) of $cedict_date, by its contributors, published by [MDBG](https://www.mdbg.net/chinese/dictionary?page=cc-cedict), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          - \`${UNIHAN_URL##*/}\`: the [Unihan database](https://www.unicode.org/reports/tr38/) of Unicode 18.0.0, © Unicode, Inc., under the [Unicode License v3](https://www.unicode.org/license.txt)
          - \`${EJDICT_URL##*/}\`: [EJDict](https://github.com/kujirahand/EJDict) v2.0.1 by kujirahand, [CC0 1.0](https://creativecommons.org/publicdomain/zero/1.0/)

          \`\`\`
          $(cat out/SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Upstream data of $created" --notes-file notes.md
          { echo "Published $tag:"; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
